apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-app
  namespace: devops-showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showcase-app
  template:
    metadata:
      labels:
        app: showcase-app
    spec:
      containers:
        - name: showcase-app
          image: ghcr.io/dikshit1126/devops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: showcase-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
