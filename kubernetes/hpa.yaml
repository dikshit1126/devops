apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: showcase-app-hpa
  namespace: devops-showcase
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: showcase-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
